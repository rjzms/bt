<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>简答题卡片背题</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f3f7ff;
      --card: #ffffff;
      --text: #142033;
      --muted: #6b7890;
      --blue: #3478f6;
      --blue-soft: #eaf2ff;
      --border: #dfe8f7;
      --yellow: #fff0a8;
      --shadow: 0 14px 40px rgba(52, 120, 246, 0.14);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #eef5ff 0%, #f8fbff 100%);
      color: var(--text);
    }

    .app {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 14px 120px; /* ⭐关键：给底部按钮留空间 */
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .title {
      margin: 0;
      font-size: 26px;
      font-weight: 850;
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
    }

    .card {
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px;
      min-height: 420px;
      display: flex;
      flex-direction: column;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
    }

    .question {
      font-size: 24px;
      font-weight: 850;
      margin-top: 10px;
      line-height: 1.4;
    }

    .answer {
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      background: #f3f7ff;
      display: none;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .answer.show {
      display: block;
    }

    .actions {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      border: 1px solid var(--border);
      background: white;
      border-radius: 14px;
      padding: 12px;
      font-weight: 700;
    }

    .primary {
      background: var(--blue);
      color: white;
      border: none;
    }

    /* ⭐⭐⭐ 核心修改：底部固定按钮栏 */
    .actions {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;

      display: grid;
      grid-template-columns: 1.2fr 1.2fr 1.2fr 0.8fr;
      gap: 8px;

      padding: 10px;
      border-radius: 16px;

      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);

      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    /* ⭐按钮优化（手机手感） */
    .actions button {
      padding: 12px 6px;
      font-size: 13px;
      border-radius: 12px;
    }

    .actions button:nth-child(1),
    .actions button:nth-child(3) {
      background: var(--blue);
      color: white;
      border: none;
      font-weight: 800;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">
    <div>
      <h1 class="title">简答题卡片</h1>
      <div class="sub">GitHub JSON 自动刷题</div>
    </div>
  </div>

  <div class="card">

    <div class="meta">
      <span id="info">加载中...</span>
      <span id="progress">0/0</span>
    </div>

    <div class="question" id="q">正在读取题库...</div>

    <div class="answer" id="a"></div>

  </div>

</div>

<!-- ⭐⭐⭐ 底部固定按钮（优化重点） -->
<div class="actions">
  <button onclick="prev()">← 上一题</button>
  <button onclick="toggle()">答案</button>
  <button onclick="next()">下一题 →</button>
  <button onclick="randomQ()">随机</button>
</div>

<script>

let data = [];
let i = 0;

/* GitHub配置（不动你的逻辑） */
const USER = "rjzms";
const REPO = "bt";
const BRANCH = "main";

/* 读取 JSON */
async function load() {

  const url = `https://api.github.com/repos/${USER}/${REPO}/contents?ref=${BRANCH}`;

  const res = await fetch(url);
  const files = await res.json();

  const jsonFiles = files.filter(f => f.name.endsWith(".json"));

  for (let f of jsonFiles) {
    const r = await fetch(f.download_url);
    const arr = await r.json();
    data.push(...arr);
  }

  document.getElementById("info").innerText =
    `题库：${jsonFiles.length}文件 / ${data.length}题`;

  render();
}

function render() {
  if (!data.length) return;

  const d = data[i];

  document.getElementById("q").innerText = d.q || "";
  document.getElementById("a").innerText = d.a || "";

  document.getElementById("progress").innerText =
    `${i + 1}/${data.length}`;
}

function next() {
  if (i < data.length - 1) i++;
  render();
}

function prev() {
  if (i > 0) i--;
  render();
}

function randomQ() {
  i = Math.floor(Math.random() * data.length);
  render();
}

function toggle() {
  document.getElementById("a").classList.toggle("show");
}

/* 手机滑动 */
let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  let dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 60) {
    dx > 0 ? prev() : next();
  }
});

load();

</script>

</body>
</html>
