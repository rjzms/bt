<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡片背题</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#f5f7ff;
}

/* ===== 顶部控制（弱化） ===== */
.panel{
  position:fixed;
  top:0;
  left:0;
  right:0;
  background:white;
  border-bottom:1px solid #eee;
  z-index:10;
  padding:10px;
}

/* 默认收起（重点） */
.panel-content{
  display:none;
}

/* 打开才显示 */
.panel.open .panel-content{
  display:block;
}

/* ===== 卡片核心 ===== */
.card{
  padding:70px 16px 120px;
}

/* 题目 */
.q{
  font-size:26px;
  font-weight:800;
  line-height:1.4;
}

/* 答案 */
.a{
  margin-top:20px;
  padding:16px;
  background:#eaf1ff;
  border-radius:14px;
  display:none;
  white-space:pre-wrap;
}

.a.show{
  display:block;
}

/* ===== 底部操作 ===== */
.bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  padding:10px;
  gap:8px;
  background:white;
  border-top:1px solid #eee;
  z-index:20;
}

button{
  padding:12px;
  border:none;
  border-radius:12px;
  background:#f2f4ff;
}

.primary{
  background:#3478f6;
  color:white;
}
</style>
</head>

<body>

<!-- ===== 设置层（弱化） ===== -->
<div class="panel" id="panel">
  <button onclick="togglePanel()">☰ 题库 / 设置</button>

  <div class="panel-content">
    <div id="info">加载中...</div>
    <input placeholder="搜索题目">
  </div>
</div>

<!-- ===== 学习层 ===== -->
<div class="card">

  <div class="q" id="q">加载中...</div>

  <div class="a" id="a"></div>

</div>

<!-- ===== 底部操作 ===== -->
<div class="bar">
  <button onclick="prev()">上一题</button>
  <button class="primary" onclick="toggleAnswer()">显示答案</button>
  <button onclick="next()">下一题</button>
</div>

<script>

let data=[];
let i=0;

const USER="rjzms";
const REPO="bt";
const BRANCH="main";

/* ===== 顶部面板 ===== */
function togglePanel(){
  document.getElementById("panel").classList.toggle("open");
}

/* ===== 数据加载 ===== */
async function load(){
  const url=`https://api.github.com/repos/${USER}/${REPO}/contents?ref=${BRANCH}`;
  const res=await fetch(url);
  const files=await res.json();

  const jsonFiles=files.filter(f=>f.name.endsWith(".json"));

  for(let f of jsonFiles){
    const r=await fetch(f.download_url);
    const arr=await r.json();
    data.push(...arr);
  }

  document.getElementById("info").innerText=
    `题库：${jsonFiles.length}个 / ${data.length}题`;

  render();
}

/* ===== 渲染 ===== */
function render(){
  if(!data.length) return;

  const d=data[i];

  document.getElementById("q").innerText=d.q;
  document.getElementById("a").innerText=d.a;

  document.querySelector(".primary").innerText="显示答案";
}

/* ===== 操作 ===== */
function next(){ if(i<data.length-1) i++; render(); }
function prev(){ if(i>0) i--; render(); }

function toggleAnswer(){
  document.getElementById("a").classList.toggle("show");
}

load();

/* ===== 点击任意区域显示答案（沉浸模式） ===== */
document.querySelector(".card").onclick=function(){
  toggleAnswer();
}

/* ===== 滑动 ===== */
let startX=0;
document.addEventListener("touchstart",e=>{
  startX=e.touches[0].clientX;
});

document.addEventListener("touchend",e=>{
  let dx=e.changedTouches[0].clientX-startX;
  if(Math.abs(dx)>60){
    dx>0?prev():next();
  }
});

</script>

</body>
</html>
