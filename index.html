<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡片背题系统</title>

<style>
body{
  margin:0;
  font-family:-apple-system, sans-serif;
  background:#f6f8ff;
}

/* ===== 主卡片 ===== */
.card{
  height:100vh;
  display:flex;
  flex-direction:column;
  padding:16px;
  box-sizing:border-box;
}

/* 顶部信息 */
.top{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#888;
}

/* 题目 */
.q{
  font-size:24px;
  font-weight:800;
  margin-top:26px;
  line-height:1.4;
}

/* 答案 */
.a{
  margin-top:16px;
  padding:14px;
  background:#eaf1ff;
  border-radius:14px;
  display:none;
  font-size:15px;
  line-height:1.6;
}

.a.show{
  display:block;
}

/* 撑开 */
.spacer{
  flex:1;
}

/* ===== 底部按钮栏（重点优化） ===== */
.bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:grid;
  grid-template-columns:2fr 2fr 2fr 1fr;
  gap:6px;
  padding:10px;
  background:rgba(255,255,255,0.95);
  border-top:1px solid #eee;
}

/* 基础按钮 */
button{
  padding:12px 6px;
  border:none;
  border-radius:12px;
  font-size:13px;
  background:#f2f4ff;
}

/* 主按钮（上一题 / 下一题） */
.big{
  background:#3b7cff;
  color:#fff;
  font-weight:600;
}

/* 中间按钮 */
.mid{
  background:#e9efff;
}

/* 小按钮（随机） */
.small{
  font-size:12px;
}
</style>
</head>

<body>

<div class="card">

  <div class="top">
    <span id="info">加载题库中...</span>
    <span id="progress">0/0</span>
  </div>

  <div class="q" id="q">请先加载 JSON 题库</div>

  <div class="a" id="a"></div>

  <div class="spacer"></div>
</div>

<!-- ===== 底部控制栏 ===== -->
<div class="bar">
  <button class="big" onclick="prev()">← 上一题</button>

  <button class="mid" onclick="toggle()">显示答案</button>

  <button class="big" onclick="next()">下一题 →</button>

  <button class="small" onclick="randomQ()">随机</button>
</div>

<script>

/* ===== 数据 ===== */
let data = [];
let i = 0;

/* ===== GitHub配置（完全不改你的逻辑） ===== */
const USER = "rjzms";
const REPO = "bt";
const BRANCH = "main";

/* ===== 加载 JSON ===== */
async function load(){

  const url =
    `https://api.github.com/repos/${USER}/${REPO}/contents?ref=${BRANCH}`;

  const res = await fetch(url);
  const files = await res.json();

  const jsonFiles = files.filter(f => f.name.endsWith(".json"));

  for(let f of jsonFiles){
    const r = await fetch(f.download_url);
    const arr = await r.json();
    data.push(...arr);
  }

  document.getElementById("info").innerText =
    `题库：${jsonFiles.length} 文件 / ${data.length} 题`;

  render();
}

/* ===== 渲染 ===== */
function render(){
  if(!data.length) return;

  const d = data[i];

  document.getElementById("q").innerText = d.q || "";
  document.getElementById("a").innerText = d.a || "";

  document.getElementById("progress").innerText =
    `${i+1}/${data.length}`;
}

/* ===== 操作 ===== */
function next(){
  if(i < data.length-1) i++;
  render();
}

function prev(){
  if(i > 0) i--;
  render();
}

function randomQ(){
  i = Math.floor(Math.random()*data.length);
  render();
}

function toggle(){
  document.getElementById("a").classList.toggle("show");
}

/* ===== 手机滑动（保留体验） ===== */
let startX = 0;

document.addEventListener("touchstart",e=>{
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend",e=>{
  let dx = e.changedTouches[0].clientX - startX;

  if(Math.abs(dx) > 60){
    dx > 0 ? prev() : next();
  }
});

load();

</script>

</body>
</html>
